<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examlab2</title>
    <link rel="stylesheet" href="examstyle.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <form class="container">
        <h1>สมัคร&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<button type="reset" class="cbutton">X</button></h1>
        <p>ง่ายและรวดเร็ว</p>
        <label></label>
        <input type="text" name="name" placeholder="ชื่อ" class="short">&nbsp;
        <input type="text" name="surname" placeholder="นามสกุล" class="short">
        <br><br>
        <input type="text" name="tel" placeholder="หมายเลขโทรศัพท์" class="long">
        <br><br>
        <input type="password" name="password" placeholder="รหัสผ่านใหม่" class="long">
        <br><br>
        <label>วันเกิด</label><br>
        <select name="birthdate">
            <option>14</option>
        </select>
        <select name="birthmouth">
            <option>กุมภาพันธ์</option>
        </select>
        <select name="birthyear">
            <option>2006</option>
        </select>
        <br><br>
        <label>เพศ</label><br>
        <p class="box"><input type="radio" name="male" value="male">ชาย
        <input type="radio" name="male" value="female">หญิง</p>
        <p>
            เมื่อคลิก สมัคร แสดงว่าคุณยอมรับข้อกำหนด นโยบายข้อมูล<br>
            และนโยบายคุ้กกี่ของเรา คุณอาจได้รับการแจ้งเตือนทาง SMS<br>
            จากเราและสามารถเลือกไม่รับได้ภายหลัง
        </p>
        <button type="submit" class="sbutton">สมัคร</button>
        </form>
</body>
</html>
