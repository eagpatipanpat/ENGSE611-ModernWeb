<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Demo2</title>
</head>
<body>
    <button onclick="checkGradeSwitch()">Run Code</button>
    <pre id="output"></pre>

    <script>
        function checkGradeSwitch() {

            let score = Math.floor(Math.random() * 101);
            let grade = "";
            let pass = "";

            if (score >= 80) { grade = "A"; } 
            else if (score >= 70) { grade = "B"; } 
            else if (score >= 60) { grade = "C"; } 
            else if (score >= 50) { grade = "D"; } 
            else { grade = "F"; }

            let description = "";
            switch (grade) {
                case "A":
                    description = "ยอดเยี่ยมมาก";
                    break;
                case "B":
                    description = "ดีมาก รักษามาตรฐานไว้";
                    break;
                case "C":
                    description = "ทำได้ดี";
                    break;
                case "D":
                    description = "ต้องพยายามอีกนิด";
                    break;
                case "F":
                    description = "ต้องปรับปรุงอย่างหนัก";
                    break;
            }

            if (score >= 50) { pass = "ผ่าน"; }
            else { pass = "ไม่ผ่าน"; }

            let result = `คะแนนที่สุ่มได้: ${score}\nเกรด: ${grade}\nผลสอบ: ${pass}\nคำอธิบาย: ${description}`;
            document.getElementById("output").textContent = result;
            console.log(result);
        }
    </script>
</body>
</html>
